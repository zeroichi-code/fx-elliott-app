<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; background: #333; min-height: 100vh; }
  .feature {
    width: 1024px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 80% 50%, rgba(0, 200, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 100%, rgba(255, 200, 0, 0.10) 0%, transparent 55%),
      linear-gradient(135deg, #0a0a0f 0%, #11131f 50%, #1a1a2e 100%);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: #fff;
  }
  /* Grid background */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Elliott wave SVG */
  svg.wave {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 700px;
    height: 480px;
    opacity: 0.95;
  }
  /* Text block */
  .text {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .badge {
    display: inline-block;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: #00d4ff;
    border: 1px solid #00d4ff;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 22px;
    font-weight: 500;
  }
  .catch {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #fff 0%, #cfeaff 60%, #ffd76e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
    margin-bottom: 18px;
  }
  .app-name {
    font-size: 22px;
    color: #cfd8e3;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .app-name .sep { color: #00d4ff; margin: 0 10px; }
  /* Right side decoration */
  .signal-pill {
    position: absolute;
    z-index: 3;
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    backdrop-filter: blur(6px);
  }
  .pill-buy { top: 60px; right: 80px; background: rgba(0, 200, 100, 0.85); color: #fff; box-shadow: 0 4px 20px rgba(0,200,100,0.5); }
  .pill-wave { bottom: 60px; right: 60px; background: rgba(255, 215, 110, 0.9); color: #1a1a2e; box-shadow: 0 4px 20px rgba(255,215,110,0.4); }
</style>
</head>
<body>
<div class="feature" id="feature">
  <div class="grid"></div>

  <svg class="wave" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.4"/>
        <stop offset="50%" stop-color="#00d4ff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#ffd76e" stop-opacity="1"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <!-- Elliott impulse wave 1-2-3-4-5 + ABC -->
    <polyline
      points="20,400 110,250 180,310 290,140 360,200 470,60 540,180 610,110 680,220"
      fill="none" stroke="url(#lineGrad)" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Wave numbers -->
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#cfeaff">
      <text x="100" y="232">1</text>
      <text x="172" y="338">2</text>
      <text x="282" y="122">3</text>
      <text x="354" y="225">4</text>
      <text x="462" y="44">5</text>
      <text x="538" y="206" fill="#ffd76e">A</text>
      <text x="606" y="92" fill="#ffd76e">B</text>
      <text x="672" y="245" fill="#ffd76e">C</text>
    </g>
    <!-- Dots -->
    <g fill="#fff">
      <circle cx="20" cy="400" r="5"/>
      <circle cx="110" cy="250" r="6"/>
      <circle cx="180" cy="310" r="6"/>
      <circle cx="290" cy="140" r="6"/>
      <circle cx="360" cy="200" r="6"/>
      <circle cx="470" cy="60" r="7" fill="#00d4ff"/>
      <circle cx="540" cy="180" r="6" fill="#ffd76e"/>
      <circle cx="610" cy="110" r="6" fill="#ffd76e"/>
      <circle cx="680" cy="220" r="6" fill="#ffd76e"/>
    </g>
    <!-- Subtle horizontal fibo lines -->
    <g stroke="#00d4ff" stroke-opacity="0.15" stroke-dasharray="4 6" stroke-width="1">
      <line x1="0" y1="120" x2="700" y2="120"/>
      <line x1="0" y1="200" x2="700" y2="200"/>
      <line x1="0" y1="280" x2="700" y2="280"/>
      <line x1="0" y1="360" x2="700" y2="360"/>
    </g>
  </svg>

  <div class="text">
    <span class="badge">FX × ELLIOTT WAVE</span>
    <div class="catch">波を読む目を、<br>あなたに。</div>
    <div class="app-name">FXエリオット波動チェッカー<span class="sep">|</span>無料</div>
  </div>

  <div class="signal-pill pill-buy">▲ BUY</div>
  <div class="signal-pill pill-wave">WAVE 5</div>
</div>
</body>
</html>
